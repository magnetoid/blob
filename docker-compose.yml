# Development infrastructure. The app itself runs on the host via `pnpm dev`.
# For the full production stack see docker-compose.prod.yml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blob
      POSTGRES_PASSWORD: blob
      POSTGRES_DB: blob
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blob']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ['6379:6379']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
      # quay.io, not Docker Hub. MinIO stopped publishing to `minio/minio` there and the
      # repository now 404s, which broke both CI jobs and every `docker compose up` at
      # once — an image reference is a dependency on someone else's registry policy, and
      # this is what it looks like when that policy changes. quay.io is MinIO's own.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: blobadmin
      MINIO_ROOT_PASSWORD: blobadmin123
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket on first boot, then exits.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 blobadmin blobadmin123 &&
      mc mb --ignore-existing local/blob-files &&
      echo 'bucket ready'"

  # WebRTC for meetups. `--dev` serves the placeholder pair devkey/secret, which is the
  # same trade the MinIO credentials above make: a fixed value that is obviously not a
  # secret beats one that has to be generated before anything works.
  #
  # 7880 is the signalling WebSocket the browser opens, 7881 the TCP fallback for networks
  # that block UDP, and 7882/udp carries the media. One UDP port rather than LiveKit's
  # default 50000-60000 range, because a range that size is a firewall argument nobody
  # wants to have twice — and the production stack is bound by the same choice.
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0 --udp-port 7882
    ports: ['7880:7880', '7881:7881', '7882:7882/udp']
    environment:
      - 'LIVEKIT_CONFIG=webhook: {api_key: devkey, urls: ["http://host.docker.internal:3000/api/calls/livekit"]}'
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Catches all outgoing mail in dev. UI at http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    ports: ['1025:1025', '8025:8025']

  # The agent the product assumes. `COMPOSE_PROFILES=janus docker compose up -d` starts
  # it; the four JANUS_* lines in .env.example (JANUS_AGUI_URL, JANUS_SIGNING_SECRET,
  # JANUS_AGENT_NAME, JANUS_API_SERVER_KEY) are what the API needs — the last one is
  # required by this service itself, which refuses to start without it, *and* read by the
  # app, for the Janus page: /admin/janus reads and changes what Janus runs on through
  # this service's own API. In dev the API runs on the host off the repo-root .env, so
  # there is nothing to pass it here the way docker-compose.prod.yml passes the `app`
  # service; set it in .env once and both sides have it.
  janus:
    image: ghcr.io/magnetoid/janus:${JANUS_VERSION:-0.18.0}
    restart: unless-stopped
    profiles: ["janus"]
    # Without this the image's entrypoint starts the interactive CLI and the container
    # comes up listening on nothing. Janus's own compose file says so too.
    command: ["gateway", "run"]
    ports: ["8642:8642"]
    environment:
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      # Mandatory even on a private network: the API server refuses to start without it.
      - API_SERVER_KEY=${JANUS_API_SERVER_KEY}
      # The same value Blob holds as JANUS_SIGNING_SECRET. Its presence is also what
      # registers the /v1/agui route at all — no secret, no route.
      - BLOB_SIGNING_SECRET=${JANUS_SIGNING_SECRET}
      # ⚠ These two do NOT configure the agent that answers a mention. Measured on
      # 2026-09-15: nothing under Janus's `gateway/` or `agent/` reads `JANUS_MODEL` or
      # `JANUS_INFERENCE_MODEL` — only its TUI and one-shot CLI paths do. The gateway
      # reads `$JANUS_HOME/config.yaml`, which is `/opt/data/config.yaml` on the volume
      # below, and a fresh volume starts on the image's packaged default
      # (`anthropic/claude-opus-4.6`). Pointed at DeepSeek, that default is refused by
      # name — "the supported API model names are deepseek-flash, deepseek-v4-pro" — and
      # the run finishes with no text at all, which reaches a channel as silence.
      #
      # So after a first boot on a new volume the model has to be set in that file. A
      # Blob settings page that writes it is the next slice; until then it is one edit
      # and a restart of this container. These stay because the CLI paths do read them.
      - JANUS_TUI_PROVIDER=${JANUS_PROVIDER:-deepseek}
      # Not `deepseek-chat`: DeepSeek retired it on 2026-09-14 and it does not 404 — it
      # answers 200 and then sends no body, so a run hangs to the caller's timeout.
      - JANUS_MODEL=${JANUS_MODEL:-deepseek-v4-pro}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # 90 iterations and a 30-minute API timeout are right for a terminal and hopeless
      # for a chat message. What the caller actually allows is AGUI_MAX_RUN_SEC — 600s of
      # wall clock on one run — and 30s of silence between events (AGUI_READ_TIMEOUT_SEC);
      # the 120s in AGUI_TIMEOUT_SEC is the connect/write timeout and never the run cap.
      # So 100s below is a deliberate cap well under what the caller would tolerate, on
      # the view that a channel wants an answer or a failure quickly — not a number
      # forced by the caller. Raising it is a product decision, not an edit to this line.
      # The 15s keepalive is sized against the 30s silence cap, not against that 100s.
      - JANUS_MAX_ITERATIONS=${JANUS_MAX_ITERATIONS:-25}
      - BLOB_AGUI_RUN_TIMEOUT_SECONDS=100
      - BLOB_AGUI_KEEPALIVE_SECONDS=15
      # On a fresh volume the gateway is created stopped and answers nothing. This is the
      # bootstrap the image reads once, on first boot, to bring it up.
      - JANUS_GATEWAY_BOOTSTRAP_STATE=running
    volumes:
      # The image declares VOLUME /opt/data and JANUS_HOME points there. Without a named
      # volume Docker mints an anonymous one and every deploy starts from nothing.
      - janusdata:/opt/data
    # No healthcheck, deliberately: under s6 the supervised process is not the API server,
    # so container liveness says nothing, and a check that cannot pass fails the deploy.

volumes:
  pgdata:
  redisdata:
  miniodata:
  janusdata:
