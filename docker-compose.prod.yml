# Production stack, shaped for Coolify.
#
# In Coolify: new resource → Docker Compose → point "Docker Compose Location" at
# /docker-compose.prod.yml → deploy. The SERVICE_* names below are Coolify's own: on the
# first deploy it generates the domain, the database password and the session secret, and
# reuses them on every deploy after. Nothing here needs editing to get a working
# workspace; SMTP is the one thing worth filling in, and only when you want invitations
# to arrive by mail rather than by copied link.
#
# The same file runs under plain `docker compose up` if you set the four ${...} values
# yourself.
#
# The app's environment is repeated on the worker rather than shared through a YAML
# anchor: Coolify parses and rewrites this file to add its own labels and networks, and
# repetition is cheaper than depending on what survives that.

services:
  # The API, the WebSocket tier and the built client, from one image on one origin.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Generates the public domain and routes it to port 3000. PUBLIC_URL must match it
      # exactly — it is the origin every mutating request is checked against.
      - SERVICE_FQDN_APP_3000
      # Coolify's generated value can come through without a scheme, and a schemeless
      # PUBLIC_URL parses to an empty host — which fails the origin check on every
      # sign-in with "Blocked request." Set PUBLIC_URL explicitly to the full public
      # origin and this falls back to it.
      - PUBLIC_URL=${PUBLIC_URL:-${SERVICE_FQDN_APP}}
      # How many proxies append to X-Forwarded-For after the one naming the caller.
      # Coolify puts Traefik in front, and most installs put a TLS terminator in front of
      # that — which is 1. Behind a single reverse proxy it is 0. Get this wrong upwards
      # and the rate limits count against a header the caller writes; see lib/caller.py.
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-1}
      # Not decoration: this is what marks the session cookie Secure and drops the
      # localhost exemption in the origin check.
      - NODE_ENV=production
      - DATABASE_URL=postgres://blob:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/blob
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=${SERVICE_BASE64_64_SESSION}
      - SESSION_TTL_DAYS=${SESSION_TTL_DAYS:-30}
      # The endpoint the server uses, then the one the browser must use. A presigned URL
      # is signed for a specific host, so these differ behind a container network and
      # the public one has to be set or every attachment link fails to resolve.
      #
      # Set S3_PUBLIC_ENDPOINT explicitly, scheme included. SERVICE_FQDN_MINIO is a bare
      # hostname by Coolify's design — the docs are clear that only SERVICE_URL_* carries
      # a scheme — and boto3 signs against a URL, so the fallback below is a last resort
      # that produces links no browser will follow. Same trap as PUBLIC_URL above.
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-https://${SERVICE_FQDN_MINIO}}
      - S3_BUCKET=${S3_BUCKET:-blob-files}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-blobadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-blobadmin123}
      - S3_FORCE_PATH_STYLE=true
      # Mail failures are logged, never fatal: invite links are also shown in the UI, so
      # an unconfigured mail server costs convenience rather than access.
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-Blob <chat@example.com>}
      # `npx web-push generate-vapid-keys`. Without them, notifications stay in-app.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
      # Meetups. Empty is a supported state: the endpoints answer
      # `livekit_not_configured` and the rest of the workspace is untouched. LIVEKIT_URL
      # is what the browser dials, so it is the wss:// public address of the livekit
      # service below and never its container name.
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      # A model for Catch-up and thread summaries — not an agent; the agent is Janus,
      # configured on its own service below. Set LLM_PROVIDER and LLM_API_KEY and this
      # server can summarise; leave them and both features say so instead of guessing.
      #
      # Passed to the worker as well so the two services see one environment. Today only
      # this process reads them — Catch-up and a thread summary are both made at request
      # time — but a worker-side caller added later must not silently lack the key.
      - LLM_PROVIDER=${LLM_PROVIDER:-disabled}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      # Janus, when COMPOSE_PROFILES=janus starts the service further down. These belong
      # here and not only in that service's own block: the values there are read by the
      # container, and this file passes settings by explicit `environment:` entries with
      # no `env_file` behind them, so a variable named only over there never reaches this
      # process at all. Without these three lines an operator sets everything correctly
      # and gets no agent and no error — `configured()` is false, the boot reconcile seeds
      # nothing, and startup logs nothing because it only logs when it seeded something.
      #
      # The URL is internal (the `agents` network below), and the secret is the one value
      # both sides read: the app writes it onto the install, the container verifies with
      # it, and a mismatch is a 401 on every run that looks exactly like the agent being
      # down. There is no orchestration step that could agree on it otherwise.
      - JANUS_AGUI_URL=${JANUS_AGUI_URL:-}
      - JANUS_SIGNING_SECRET=${JANUS_SIGNING_SECRET:-}
      - JANUS_AGENT_NAME=${JANUS_AGENT_NAME:-Janus}
      # Hosting agents means calling the runner's API. Reach it through the host gateway
      # rather than by joining the runner's own Docker network: that network has a
      # container aliased `postgres` too, so joining it makes this app's `postgres`
      # resolve to two different databases and authentication fails on whichever one DNS
      # happens to pick. Set COOLIFY_API_URL to http://host.docker.internal:8000 (or
      # wherever the runner listens) to switch agent hosting on.
      #
      # Setting it is not always enough. host.docker.internal is an address *on the host*,
      # so the call arrives on the host's INPUT chain — and a host with a default-deny
      # INPUT policy drops it silently: the request hangs until the deploy timeout and
      # nothing logs a refusal. If agent installs time out while `curl` from the host
      # works, that is this. Allow the app's own docker subnet to reach the runner's port
      # and nothing wider; on a Plesk host, add that rule with a plain `iptables -I INPUT`
      # from a boot-time unit rather than through Plesk, whose apply step flushes the
      # FORWARD and nat tables and takes every container on the machine offline with it.
      - COOLIFY_API_URL=${COOLIFY_API_URL:-}
      - COOLIFY_TOKEN=${COOLIFY_TOKEN:-}
      - COOLIFY_PROJECT_UUID=${COOLIFY_PROJECT_UUID:-}
      - COOLIFY_SERVER_UUID=${COOLIFY_SERVER_UUID:-}
      - COOLIFY_DESTINATION_UUID=${COOLIFY_DESTINATION_UUID:-}
      - AGENT_RUNNER=${AGENT_RUNNER:-disabled}
      - AGENT_ALLOW_PRIVATE_ENDPOINTS=${AGENT_ALLOW_PRIVATE_ENDPOINTS:-false}
    networks:
      # The stack's own network, plus one shared only with agents hosted on this box.
      # Naming `default` explicitly is required: the moment a service lists any network,
      # Compose stops attaching it to the default one, and this app would lose its
      # database.
      - default
      - agents
    extra_hosts:
      # So the runner's API is reachable without sharing a network with it.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness only. /readyz is the one that checks Postgres and Redis; using it here
      # would restart the app whenever the database blinked.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:3000/healthz',timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 3

  # Notifications, link unfurls and the orphan sweep. Same image, different entrypoint,
  # so a slow push provider can never delay a message.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["arq", "blob_api.jobs.worker.WorkerSettings"]
    environment:
      # The app has already migrated by the time this starts.
      - RUN_MIGRATIONS=false
      - PUBLIC_URL=${PUBLIC_URL:-${SERVICE_FQDN_APP}}
      # How many proxies append to X-Forwarded-For after the one naming the caller.
      # Coolify puts Traefik in front, and most installs put a TLS terminator in front of
      # that — which is 1. Behind a single reverse proxy it is 0. Get this wrong upwards
      # and the rate limits count against a header the caller writes; see lib/caller.py.
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-1}
      - NODE_ENV=production
      - DATABASE_URL=postgres://blob:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/blob
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=${SERVICE_BASE64_64_SESSION}
      # The endpoint the server uses, then the one the browser must use. A presigned URL
      # is signed for a specific host, so these differ behind a container network and
      # the public one has to be set or every attachment link fails to resolve.
      #
      # Set S3_PUBLIC_ENDPOINT explicitly, scheme included. SERVICE_FQDN_MINIO is a bare
      # hostname by Coolify's design — the docs are clear that only SERVICE_URL_* carries
      # a scheme — and boto3 signs against a URL, so the fallback below is a last resort
      # that produces links no browser will follow. Same trap as PUBLIC_URL above.
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-https://${SERVICE_FQDN_MINIO}}
      - S3_BUCKET=${S3_BUCKET:-blob-files}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-blobadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-blobadmin123}
      - S3_FORCE_PATH_STYLE=true
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-Blob <chat@example.com>}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
      # Not read here today — Catch-up and thread summaries run in the app — but kept
      # identical to the app's so the two services see one environment.
      - LLM_PROVIDER=${LLM_PROVIDER:-disabled}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      # The same three as the app, for the reason stated on the LLM block above: these two
      # services are one image and a mention is answered *here*, so a value that is true in
      # one container and absent in the other is the drift that produces an agent which
      # exists, is mentionable, and cannot work. Seeding is the app's job today, and this
      # is what keeps the day something here reads them from being a debugging session.
      - JANUS_AGUI_URL=${JANUS_AGUI_URL:-}
      - JANUS_SIGNING_SECRET=${JANUS_SIGNING_SECRET:-}
      - JANUS_AGENT_NAME=${JANUS_AGENT_NAME:-Janus}
      # The deployment-sync cron runs here, refreshing hosted agents' status and
      # callback URLs — so the worker talks to the runner exactly as the app does.
      # Without these the sync silently syncs nothing, and a repointed agent stays
      # registered at its dead address until somebody opens the deployment card.
      - COOLIFY_API_URL=${COOLIFY_API_URL:-}
      - COOLIFY_TOKEN=${COOLIFY_TOKEN:-}
      - COOLIFY_PROJECT_UUID=${COOLIFY_PROJECT_UUID:-}
      - COOLIFY_SERVER_UUID=${COOLIFY_SERVER_UUID:-}
      - COOLIFY_DESTINATION_UUID=${COOLIFY_DESTINATION_UUID:-}
      - AGENT_RUNNER=${AGENT_RUNNER:-disabled}
    networks:
      - default
      - agents
    extra_hosts:
      # Same host-gateway route to the runner's API as the app; see the note there.
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # The image's own HEALTHCHECK polls :3000, which only the app serves — inherited
      # unchanged, this container could never be healthy. What matters for a worker is
      # whether it can still reach the queue.
      test: ["CMD", "python", "-c", "import os,redis; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=blob
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=blob
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blob -d blob"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Presence and typing are disposable, but the job queue is not: arq holds queued
    # notifications and unfurls in Redis, and they should survive a restart.
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Attachments. The browser uploads here directly with a presigned PUT and follows a
  # presigned GET to read, so this service needs its own public hostname: a signature
  # covers the host, and a URL signed for `http://minio:9000` is one the browser cannot
  # resolve. That is what SERVICE_FQDN_MINIO_9000 and S3_PUBLIC_ENDPOINT above are for.
  #
  # There is no bucket-init container: one that exits makes `docker compose up --wait`
  # report failure even on exit 0. The app creates the bucket on first upload instead.
  #
  # To use a managed S3 instead, delete this service and set S3_ENDPOINT, S3_BUCKET,
  # S3_ACCESS_KEY, S3_SECRET_KEY and S3_FORCE_PATH_STYLE=false.
  # WebRTC for meetups. Two halves that reach the browser by different routes, which is
  # the whole difficulty of putting this behind a reverse proxy.
  #
  # **No domain is generated for this on purpose.** It boots with LiveKit's placeholder
  # credentials so an unconfigured stack still comes up, and a public address plus known
  # credentials is an open relay for anyone who finds it. Enabling meetups is therefore
  # deliberate in three steps: give this service a domain in Coolify, set LIVEKIT_API_KEY
  # and LIVEKIT_API_SECRET to a generated pair, and set LIVEKIT_URL on the app to the
  # wss:// form of that domain. Until then the app issues no tokens and meetups answer
  # `livekit_not_configured`.
  #
  # Signalling is an ordinary WebSocket, so once it has a domain Traefik terminates TLS
  # and forwards to 7880 with nothing special needed. Media is not. WebRTC is UDP
  # and a reverse proxy only speaks TCP, so 7882/udp is published straight onto the host
  # and **must be open in the firewall**. Miss that and a call connects, shows both
  # participants, and carries no sound — the failure looks like a bug in the app.
  #
  # One UDP port rather than LiveKit's 50000-60000 default. A ten thousand port range on a
  # shared box is a firewall argument nobody wants to have twice; one port costs a little
  # multiplexing and is something you can actually reason about.
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    # Off unless asked for. Meetups are the one feature with an external dependency
    # that may simply be absent, and with no `LIVEKIT_*` settings every meetup endpoint
    # already answers `livekit_not_configured` while the rest of the workspace carries
    # on. A media server that nobody has configured should not also be able to stop
    # chat from starting, which is exactly what it did on 2026-09-11: two Blob stacks
    # share this host, the second one's bind of 7882/udp failed, `docker compose up`
    # gave up, and the app and worker were left created-but-never-started. Turn it on
    # with `COMPOSE_PROFILES=meetups` alongside the three `LIVEKIT_*` values.
    profiles: ["meetups"]
    # The UDP port is named three times on purpose — LiveKit advertises the port it was
    # told to bind, so the flag and both halves of the mapping have to agree. A second
    # instance on the same host needs its own `LIVEKIT_UDP_PORT`.
    command: --bind 0.0.0.0 --udp-port ${LIVEKIT_UDP_PORT:-7882}
    environment:
      # `key: secret`, LiveKit's own format, and it **must be quoted**. Unquoted, the
      # `: ` in the middle is YAML's key-value separator, so Compose reads the whole
      # entry as a mapping and refuses the file with "unexpected type
      # map[string]interface {}" — which fails the boot before any container starts.
      #
      # The defaults are LiveKit's own placeholders and are not secrets. They exist so
      # the stack boots unconfigured; they are safe only because nothing routes to this
      # service until you give it a domain. Set the real pair from
      # `docker run --rm livekit/livekit-server generate-keys` when you enable meetups —
      # the same two values configure this server and the app that mints tokens for it.
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
    ports:
      # Media, and the TCP fallback for clients whose network blocks UDP outright.
      # `LIVEKIT_TCP_PORT` moves only the host side: LiveKit still advertises 7881, so
      # a host port that differs from it also needs `rtc.tcp_port` in a LiveKit config.
      - '${LIVEKIT_UDP_PORT:-7882}:${LIVEKIT_UDP_PORT:-7882}/udp'
      - '${LIVEKIT_TCP_PORT:-7881}:7881'

  # Janus, when this deployment wants it. Off unless COMPOSE_PROFILES=janus, for the same
  # reason LiveKit is: on 2026-09-11 an optional service that could not start stopped the
  # whole stack, and an agent nobody configured must not be able to keep chat down.
  #
  # No `ports:` and no domain on purpose. Blob reaches it on the `agents` network below at
  # http://janus:8642/v1/agui, which is what JANUS_AGUI_URL says. Its /v1/agui
  # authenticates every request by HMAC against the shared secret, and nothing else is
  # exposed to anything.
  janus:
    image: ghcr.io/magnetoid/janus:${JANUS_VERSION:-0.16.0}
    restart: unless-stopped
    profiles: ["janus"]
    # Without this the image's entrypoint starts the interactive CLI and the container
    # comes up listening on nothing. Janus's own compose file says so too.
    command: ["gateway", "run"]
    networks: [agents]
    environment:
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      # Mandatory even on a private network: the API server refuses to start without it.
      - API_SERVER_KEY=${JANUS_API_SERVER_KEY}
      # The same value Blob holds as JANUS_SIGNING_SECRET. Its presence is also what
      # registers the /v1/agui route at all — no secret, no route.
      - BLOB_SIGNING_SECRET=${JANUS_SIGNING_SECRET}
      # ⚠ These two do NOT configure the agent that answers a mention. Measured on
      # 2026-09-15: nothing under Janus's `gateway/` or `agent/` reads `JANUS_MODEL` or
      # `JANUS_INFERENCE_MODEL` — only its TUI and one-shot CLI paths do. The gateway
      # reads `$JANUS_HOME/config.yaml`, which is `/opt/data/config.yaml` on the volume
      # below, and a fresh volume starts on the image's packaged default
      # (`anthropic/claude-opus-4.6`). Pointed at DeepSeek, that default is refused by
      # name — "the supported API model names are deepseek-flash, deepseek-v4-pro" — and
      # the run finishes with no text at all, which reaches a channel as silence.
      #
      # So after a first boot on a new volume the model has to be set in that file. A
      # Blob settings page that writes it is the next slice; until then it is one edit
      # and a restart of this container. These stay because the CLI paths do read them.
      - JANUS_TUI_PROVIDER=${JANUS_PROVIDER:-deepseek}
      # Not `deepseek-chat`: DeepSeek retired it on 2026-09-14 and it does not 404 — it
      # answers 200 and then sends no body, so a run hangs to the caller's timeout.
      - JANUS_MODEL=${JANUS_MODEL:-deepseek-v4-pro}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # 90 iterations and a 30-minute API timeout are right for a terminal and hopeless
      # for a chat message. What the caller actually allows is AGUI_MAX_RUN_SEC — 600s of
      # wall clock on one run — and 30s of silence between events (AGUI_READ_TIMEOUT_SEC);
      # the 120s in AGUI_TIMEOUT_SEC is the connect/write timeout and never the run cap.
      # So 100s below is a deliberate cap well under what the caller would tolerate, on
      # the view that a channel wants an answer or a failure quickly — not a number
      # forced by the caller. Raising it is a product decision, not an edit to this line.
      # The 15s keepalive is sized against the 30s silence cap, not against that 100s.
      - JANUS_MAX_ITERATIONS=${JANUS_MAX_ITERATIONS:-25}
      - BLOB_AGUI_RUN_TIMEOUT_SECONDS=100
      - BLOB_AGUI_KEEPALIVE_SECONDS=15
      # On a fresh volume the gateway is created stopped and answers nothing. This is the
      # bootstrap the image reads once, on first boot, to bring it up.
      - JANUS_GATEWAY_BOOTSTRAP_STATE=running
    volumes:
      # The image declares VOLUME /opt/data and JANUS_HOME points there. Without a named
      # volume Docker mints an anonymous one and every deploy starts from nothing.
      - janusdata:/opt/data
    # No healthcheck, deliberately: under s6 the supervised process is not the API server,
    # so container liveness says nothing, and a check that cannot pass fails the deploy.

  minio:
      # quay.io, not Docker Hub. MinIO stopped publishing to `minio/minio` there and the
      # repository now 404s, which broke both CI jobs and every `docker compose up` at
      # once — an image reference is a dependency on someone else's registry policy, and
      # this is what it looks like when that policy changes. quay.io is MinIO's own.
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - SERVICE_FQDN_MINIO_9000
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-blobadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-blobadmin123}
    volumes:
      - miniodata:/data
    # No health check on purpose. The probes MinIO documents depend on tooling whose
    # presence varies by image tag, and `docker compose up --wait` fails the whole
    # deploy on a health check that cannot pass — a worse outcome than none, since
    # nothing blocks on this service starting: the bucket is created on first upload.

networks:
  # Shared with agents deployed beside this stack, so the app can reach one without a
  # public hostname and a certificate for a hop that never leaves the machine.
  #
  # **This stack creates it.** It was `external: true` for one commit, on the reasoning
  # that the network outlives any single deploy and two stacks have to agree on it. Both
  # halves are true and the conclusion was still wrong: `external` means Compose refuses
  # to start when it is absent, so a host that had never run `docker network create
  # blob-agents` by hand could not boot the stack at all. CI caught it — "network
  # blob-agents declared as external, but could not be found" — and on a host that
  # autodeploys from git it would have been a failed deploy on an app that was fine
  # before. A dependency on a manual step is not a dependency worth having at boot.
  #
  # Named explicitly rather than left to Compose's `<project>_agents`, so an agent stack
  # deployed separately can join it with `external: true` and a name it can predict.
  #
  # Deliberately NOT the runner's own network: that one has a container aliased
  # `postgres`, and joining it makes this stack's `postgres` resolve to two different
  # databases. Production went down that way once already.
  agents:
    name: blob-agents

volumes:
  pgdata:
  redisdata:
  miniodata:
  janusdata:
