name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Nothing here writes to the repository: the deploy job talks to
# Coolify with its own secret, and no step needs the token to do more than check out.
# Every action is pinned to a commit, not a tag — a tag is a pointer its owner can move,
# and this workflow holds the deploy secret. Dependabot proposes the bumps.
permissions:
  contents: read

jobs:
  # tsc + ruff + mypy --strict + the full pytest suite. The integration tests run
  # against real Postgres and Redis, because what they assert — idempotent inserts,
  # unread math, the permission join that keeps private channels out of other people's
  # search results — lives in SQL.
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blob
          POSTGRES_PASSWORD: blob
          POSTGRES_DB: blob_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U blob -d blob_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://blob:blob@localhost:5432/blob_test
      REDIS_URL: redis://localhost:6379/15
      SESSION_SECRET: ci-secret-that-is-at-least-32-characters-long
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: blob-test
      S3_ACCESS_KEY: blobadmin
      S3_SECRET_KEY: blobadmin123
      S3_FORCE_PATH_STYLE: 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Not a service container: MinIO needs `server /data` as its command, and the
      # services block cannot set one. Started here so the attachment and snapshot tests
      # run for real — without a bucket they skip, which is green while proving nothing.
      - name: Start object storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=blobadmin -e MINIO_ROOT_PASSWORD=blobadmin123 \
            ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z server /data
          for _ in $(seq 1 40); do
            if curl -sf http://localhost:9000/minio/health/live; then echo "storage up"; exit 0; fi
            sleep 2
          done
          echo "storage never became healthy"; docker logs minio; exit 1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
        working-directory: apps/api

      - run: pnpm check

      # The models must describe the live schema exactly, or the next autogenerate
      # proposes dropping the generated column and the partial indexes. This check was
      # failing unnoticed for two milestones before it was wired up here.
      - name: Schema matches the models
        # Migrate first. The suite used to leave blob_test at head as a side effect of
        # running; on four workers it migrates blob_test_gw0..3 instead, and a check
        # against an empty database only says "not up to date".
        run: uv run alembic upgrade head && uv run alembic check
        working-directory: apps/api

  # Builds the image and boots the real production stack. Worth its own job: the two
  # failures this catches — a uv too old for the lockfile revision, and corepack
  # prompting instead of downloading — happen only in a container, never locally.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: blob:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that produces an image which cannot boot is not a passing build. This
      # exercises the entrypoint's advisory-locked migration against a real Postgres.
      - name: Boot the production stack
        env:
          SERVICE_FQDN_APP: http://localhost:3000
          SERVICE_PASSWORD_POSTGRES: ciPostgresPassword
          SERVICE_BASE64_64_SESSION: ci-session-secret-at-least-32-characters-long
          SERVICE_USER_MINIO: ciMinioUser
          SERVICE_PASSWORD_MINIO: ciMinioPassword123
        run: docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 240

      - name: The app is live and its dependencies are reachable
        run: |
          docker compose -f docker-compose.prod.yml exec -T app python -c "
          import json, urllib.request
          for path in ('healthz', 'readyz'):
              body = json.loads(urllib.request.urlopen(f'http://127.0.0.1:3000/{path}', timeout=10).read())
              assert body.get('ok') is True, (path, body)
              # readyz also names the commit it serves, for the deploy job's verify step.
              # Nobody set SOURCE_COMMIT on this stack, so the key is present and null —
              # the honest answer, and the shape the verify step's jq expects to skip.
              if path == 'readyz':
                  assert 'commit' in body, (path, body)
              print(path, 'ok')
          "

      - name: The schema reached head
        run: |
          docker compose -f docker-compose.prod.yml exec -T postgres \
            psql -U blob -d blob -tAc "SELECT version_num FROM alembic_version"

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail 100

      - if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  # What ships is checked against the advisory databases, and the history for secrets.
  # The audits read the *shipped* set — the locked production requirements and the
  # client's runtime dependencies — because a gate that fails on a test runner's
  # advisory blocks deploys over code no user ever runs; Dependabot carries the rest.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Python dependencies that ship have no known vulnerability
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/req.txt"
          uvx pip-audit --strict --disable-pip -r "$RUNNER_TEMP/req.txt"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Client dependencies that ship have no known high-severity vulnerability
        run: pnpm audit --prod --audit-level high

      # The binary rather than the action: pinned by version and checksum, and no
      # third-party code between the checkout and the scan. `.gitleaksignore` lists the
      # reviewed test fixtures by fingerprint.
      - name: No secrets anywhere in the history
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .

  # The architectural rules declared in .torsor/architecture/decisions/ are only real if
  # something enforces them. --strict fails on *new* drift, so existing debt does not
  # block a change that did not cause it.
  intent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Not on PyPI — it lives in its own repo.
      - run: uv tool install git+https://github.com/magnetoid/torsor-helper
      - run: torsor guard --strict --severity error $(git ls-files '*.py')

  # Deploy, once everything above has passed.
  #
  # This exists because push-to-deploy was believed to be working and was not: the repo
  # had no webhook of any kind, so Coolify was never told a push had happened, and 43
  # commits sat on GitHub while the server kept serving a build from four days earlier.
  # Nothing failed — nothing was ever asked to run.
  #
  # Wiring it here rather than as a Coolify webhook on the repository is the better half
  # of fixing that, and deliberately so. A webhook fires on the push itself, which means
  # a red build deploys exactly as eagerly as a green one. `needs:` makes the gate a
  # precondition: the image has already been built and the production stack has already
  # been booted against a real Postgres by the `image` job, so by the time this runs the
  # thing being deployed is known to start.
  #
  # Skipped, not failed, when the secret is absent. A fork and a pull request must not
  # deploy anything, and someone who has not set this up should not get a red tick for a
  # step that was never theirs to run.
  deploy:
    needs: [check, image, intent, supply-chain]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Its own concurrency group, and never cancelled. The workflow-level group above
    # cancels an older run when a newer push arrives, which is right for the checks and
    # wrong here: a run cancelled after the POST leaves Coolify building anyway, with
    # nobody left to verify what came out. Newer pushes queue behind this instead — the
    # server builds one at a time regardless (the 2026-09-05 rule).
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # Coolify does not build the commit this run tested. It checks out the *tip of
      # main* when the build starts, so a commit pushed during the ~9 minutes a build
      # takes ships on the previous commit's green run without its own gates — seen on
      # 2026-09-14, when production reported a commit whose CI was still in progress.
      # Two steps close most of that and make the rest loud: refuse to deploy on purpose
      # when main has already moved on (that commit's run will), and afterwards read the
      # commit the servers actually serve, and fail if it is not this one.
      - name: Is this still the tip of main?
        env:
          REPO: ${{ github.repository }}
        run: |
          tip=$(git ls-remote -q "https://github.com/$REPO.git" refs/heads/main | cut -f1)
          if [ -n "$tip" ] && [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice title=Deferred to a newer commit::main has moved on to ${tip:0:7} since ${GITHUB_SHA:0:7} was tested. That commit's own run deploys; this one does not, so a build never ships something this run did not check."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Ask Coolify to deploy
        if: env.SKIP != '1'
        env:
          # `POST /api/v1/deploy?uuid=…`, carrying **both** application uuids
          # comma-separated — this repo is one image deployed as two instances, and a
          # gate that shipped only one of them would quietly leave the other behind,
          # which is how Hadley sat months out of date before. Coolify queues them: the
          # server is set to one concurrent build, which is the 2026-09-05 rule, so the
          # second starts when the first is done rather than beside it.
          HOOK: ${{ secrets.COOLIFY_DEPLOY_HOOK }}
          # Coolify's API token, sent as a bearer. Separate secret because the URL is not
          # itself a credential and gets pasted around; the token is.
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$HOOK" ]; then
            # This is now the only way a commit reaches production, so an absent secret
            # really does mean nothing shipped and the annotation is honest — which it
            # was not on 2026-09-13, when it fired over deploys that had already
            # happened through the repository webhooks. Those webhooks are off; if this
            # branch is reached, either the secret was removed or someone is running the
            # workflow from a fork, and `main` is ahead of both instances until it is
            # put back.
            echo "::warning title=No deploy was made::COOLIFY_DEPLOY_HOOK is not set, so this push did not reach production. Add it under Settings → Secrets and variables → Actions."
            echo "COOLIFY_DEPLOY_HOOK is not set — nothing was deployed."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # --fail-with-body so a 401 or a wrong uuid fails the job *and* prints what
          # Coolify said. A deploy step that swallows the body is how "it says it
          # deployed" and "nothing happened" coexist, which is the bug being fixed here.
          curl --fail-with-body -sS -X POST "$HOOK" \
            ${TOKEN:+-H "Authorization: Bearer $TOKEN"} \
            -H 'Accept: application/json' \
            --max-time 60 \
            -w '\nHTTP %{http_code}\n'
      # The half that makes a bypass visible. `/readyz` reports the commit the process
      # was built from (Coolify sets SOURCE_COMMIT on the container to what it checked
      # out), so this reads the servers rather than trusting the 200 above. Both
      # instances, in the order Coolify builds them; the second waits behind the first,
      # which is why the deadline is longer than one build. A miss is a red job that
      # names both commits — the thing that was silent before.
      - name: Verify what shipped
        if: env.SKIP != '1'
        env:
          ORIGINS: https://chat.imbamarketing.com https://chat.hadleyconsulting.global
        run: |
          deadline=$((SECONDS + 1500))
          for origin in $ORIGINS; do
            while :; do
              served=$(curl -sS --max-time 15 "$origin/readyz" 2>/dev/null | jq -r '.commit // empty' 2>/dev/null || true)
              if [ "$served" = "$GITHUB_SHA" ]; then
                echo "$origin serves ${served:0:7}"
                break
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error title=Production is not on this commit::$origin serves ${served:-no commit at all} 25 minutes after the deploy was asked for; expected ${GITHUB_SHA:0:7}. Either the build failed on the server, or a different commit shipped on this run's build."
                exit 1
              fi
              sleep 20
            done
          done
