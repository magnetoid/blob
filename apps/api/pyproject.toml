[project]
name = "blob-api"
version = "0.1.0"
description = "Blob chat server"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "argon2-cffi>=23.1",
    "uuid-utils>=0.10",
    "boto3>=1.35",
    "aiosmtplib>=3.0",
    "pywebpush>=2.0",
    "httpx>=0.28",
    "orjson>=3.10",
    "python-multipart>=0.0.20",
    # A terminal in a hosted agent's container. Pure-Python SSH with a real asyncio API,
    # so a PTY is a stream this event loop already knows how to wait on rather than a
    # subprocess to babysit — and no OpenSSH binary has to exist in the image.
    "asyncssh>=2.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "websockets>=14",
    "types-boto3[s3]>=1.35",
    "httpx-ws>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blob_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RUF"]
ignore = [
    "A003",   # class attribute shadowing a builtin is fine for ORM columns
    "B008",   # FastAPI's Depends() in defaults is the documented idiom
    "RUF012", # ClassVar annotations on SQLAlchemy/Pydantic config dicts
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["pywebpush.*", "arq.*", "uuid_utils.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# One event loop for the whole run: the database engine and Redis clients are bound
# to the loop that created them, and a per-test loop closes their connections.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
