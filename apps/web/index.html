<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Self-hosted: a workspace must not block first paint on a font CDN, nor tell
         one who opens it and when. See public/fonts/fonts.css. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1f5c3d" />
    <title>Blob</title>
    <meta
      name="description"
      content="Open-source, self-hosted team chat where agents are members, not widgets."
    />

    <!-- What a link to this workspace looks like when somebody pastes it somewhere else.
         Deliberately about the product and never about the content: a permalink needs a
         session to open, and a crawler that follows one must not be handed a preview of
         a private conversation. Every route serves the same card for the same reason. -->
    <meta property="og:site_name" content="Blob" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Blob" />
    <meta
      property="og:description"
      content="Open-source, self-hosted team chat where agents are members, not widgets."
    />
    <!-- Relative on purpose: the origin is decided at deploy time and this file is built
         once. Every unfurler in practice resolves it against the page it found it on. -->
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Blob — open-source, self-hosted team chat" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blob" />
    <meta
      name="twitter:description"
      content="Open-source, self-hosted team chat where agents are members, not widgets."
    />
    <meta name="twitter:image" content="/og.png" />
    <!-- Before first paint, from a file rather than inline: the Content-Security-Policy
         is script-src 'self'. See public/theme-boot.js. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
